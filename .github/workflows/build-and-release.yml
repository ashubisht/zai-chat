name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.1)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: 'false'
        type: boolean
      draft:
        description: 'Mark as draft'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          # Mac Intel (x64)
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x64
            artifact: Z.AI Chat-x64.dmg
          # Mac ARM (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
            artifact: Z.AI Chat-arm64.dmg
          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            artifact: Z.AI Chat-Setup-x64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-
            ${{ runner.os }}-cargo-

      - name: Setup Rust targets
        run: rustup target add ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build -- --target ${{ matrix.target }}
        env:
          # Explicitly disable code signing to avoid ad-hoc signature issues
          TAURI_BUNDLE_SIGNER_IDENTITY: "-"

      - name: List build outputs
        shell: bash
        run: |
          echo "Build outputs:"
          echo "All files in src-tauri/target/:"
          find src-tauri/target/ -type f -name "*.dmg" -o -name "*.msi" -o -name "*.app" 2>/dev/null || true
          echo "Bundle directory contents:"
          ls -R src-tauri/target/release/bundle/ 2>/dev/null || echo "No bundle directory found"

      - name: Upload Mac DMG artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload Windows EXE artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe

  release:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Display structure of downloaded files
        run: ls -R ./artifacts

      - name: Find and prepare release assets
        run: |
          echo "Finding all release assets..."
          mkdir -p release
          find ./artifacts -type f \( -name "*.dmg" -o -name "*.exe" \) -exec cp {} release/ \;
          echo "Files to release:"
          ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: false
          files: release/*
          body: |
            ## Z.AI Chat v${{ inputs.version }}

            A beautiful, cross-platform desktop GUI application for interacting with Z.AI's GLM API.

            ### 📦 Downloads

            **macOS (Intel):** `Z.AI Chat-x64.dmg`
            **macOS (Apple Silicon):** `Z.AI Chat-arm64.dmg`
            **Windows:** `Z.AI Chat-Setup-x64.exe`

            ### ✨ Features

            - 🔐 Secure API key storage (Keychain on Mac, Credential Manager on Windows)
            - 💾 Conversation history with local persistence
            - 🎨 Modern dark/light theme support
            - 📝 Markdown rendering with syntax highlighting
            - 🎨 SVG image generation and rendering
            - 🌙 Multiple GLM models (GLM-5, GLM-4 Plus, GLM-4.7, GLM-4, GLM-3 Turbo, GLM-3)
            - ⚙️ Conversation settings (temperature, system prompt)
            - 📊 Regular & Coding API plans

            ### 📥 Installation

            **macOS:**
            1. Download the `.dmg` file
            2. Drag Z.AI Chat to Applications folder
            3. **Right-click** the app and select "Open" (first time only)
            4. Click "Open" in the confirmation dialog
            5. Launch from Applications or Spotlight thereafter

            **Windows:**
            1. Download the `.exe` file
            2. Double-click to run installer
            3. Launch from Start Menu

            **Note:** macOS may show a security warning on first launch. This is normal for unsigned apps. Right-click and select "Open" to bypass it.

            ### 💻 System Requirements

            **macOS:** macOS 11 (Big Sur) or later
            **Windows:** Windows 10 or later (x64)

            ---
            Built with ❤️ using [Tauri 2.x](https://tauri.app/)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
