<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#grad)"/>

  <!-- Chat bubble shape -->
  <rect x="32" y="32" width="64" height="48" rx="12" fill="white" opacity="0.95"/>

  <!-- Z letter -->
  <text x="64" y="68" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#18181b" text-anchor="middle">Z</text>

  <!-- AI dots -->
  <circle cx="48" cy="96" r="6" fill="white"/>
  <circle cx="64" cy="96" r="6" fill="white"/>
  <circle cx="80" cy="96" r="6" fill="white"/>
</svg>
